<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>MediCita - Gestión de Pacientes</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

  <header>
    <h1>Gestión de Pacientes - MediCita</h1>
  </header>

  <main>

    <!-- BÚSQUEDA Y FILTROS -->
    <section class="filters">
      <input type="text" id="searchInput" placeholder="Buscar por nombre o email">

      <select id="filtroCiudad">
        <option value="">Todas las ciudades</option>
        <option value="Bogotá">Bogotá</option>
        <option value="Medellín">Medellín</option>
        <option value="Cali">Cali</option>
        <option value="Barranquilla">Barranquilla</option>
        <option value="Cartagena">Cartagena</option>
      </select>

      <select id="filtroEspecialidad">
        <option value="">Todas las especialidades</option>
        <option value="Medicina general">Medicina general</option>
        <option value="Pediatría">Pediatría</option>
        <option value="Psicología">Psicología</option>
        <option value="Dermatología">Dermatología</option>
        <option value="Nutrición">Nutrición</option>
        <option value="Ginecología">Ginecología</option>
        <option value="Cardiología">Cardiología</option>
        <option value="Fisioterapia">Fisioterapia</option>
        <option value="Psiquiatría">Psiquiatría</option>
        <option value="Endocrinología">Endocrinología</option>
      </select>

      <button id="btnAgregar">Agregar paciente</button>
    </section>

    <!-- GRID DE CARDS -->
    <section id="cardsContainer" class="cards-grid"></section>

    <!-- GRÁFICO -->
    <section class="chart-section">
      <canvas id="chartEspecialidades"></canvas>
    </section>

  </main>

  <!-- MODAL -->
  <section id="modal" class="modal hidden">
    <form id="modalForm" class="modal-content">

      <h2 id="modalTitulo">Agregar paciente</h2>

      <input type="hidden" id="modalId">

      <label>Nombre</label>
      <input type="text" id="modalNombre" required>

      <label>Email</label>
      <input type="email" id="modalEmail" required>

      <label>Ciudad</label>
      <select id="modalCiudad" required>
        <option value="Bogotá">Bogotá</option>
        <option value="Medellín">Medellín</option>
        <option value="Cali">Cali</option>
        <option value="Barranquilla">Barranquilla</option>
        <option value="Cartagena">Cartagena</option>
      </select>

      <label>Especialidad</label>
      <select id="modalEspecialidad" required>
        <option value="Medicina general">Medicina general</option>
        <option value="Pediatría">Pediatría</option>
        <option value="Psicología">Psicología</option>
        <option value="Dermatología">Dermatología</option>
        <option value="Nutrición">Nutrición</option>
        <option value="Ginecología">Ginecología</option>
        <option value="Cardiología">Cardiología</option>
        <option value="Fisioterapia">Fisioterapia</option>
        <option value="Psiquiatría">Psiquiatría</option>
        <option value="Endocrinología">Endocrinología</option>
      </select>

      <label>Edad</label>
      <input type="number" id="modalEdad" min="18" max="90" required>

      <label>Fecha última cita</label>
      <input type="date" id="modalFecha" required>

      <label>EPS</label>
      <select id="modalEPS" required>
        <option value="Sura">Sura</option>
        <option value="Nueva EPS">Nueva EPS</option>
        <option value="Sanitas">Sanitas</option>
        <option value="Compensar">Compensar</option>
        <option value="Particular">Particular</option>
      </select>

      <label>Activo</label>
      <select id="modalActivo">
        <option value="true">Activo</option>
        <option value="false">Inactivo</option>
      </select>

      <section class="modal-buttons">
        <button type="submit" class="btn-save">Guardar</button>
        <button type="button" id="btnCerrarModal" class="btn-close">Cancelar</button>
      </section>

    </form>
  </section>

  <script src="pacientes.js"></script>
  <script src="app.js"></script>

</body>
</html>
